name: Test

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate User Prisma Client
        run: npx prisma generate --schema=apps/user-service/src/prisma/schema.prisma
      
      - name: Generate Auth Prisma Client
        run: npx prisma generate --schema=apps/auth-service/src/prisma/schema.prisma

      - name: Generate Loan Prisma Client
        run: npx prisma generate --schema=apps/loan-service/src/prisma/schema.prisma

      - name: Run tests
        run: npm run test

      - name: Run test coverage
        run: npm run test:cov
